[project]
name = "ai-architect"
version = "0.1.0"
description = "Agentic AI Architect SaaS"
authors = [
    {name = "Ajinkya",email = "ajinkyanitin00@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "langchain (>=1.4.3,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0)",
    "langchain-huggingface (>=1.0.0,<2.0.0)",
    "langchain-text-splitters (>=0.3.0,<1.0.0)",
    "langchain-mcp-adapters (>=0.1.0,<1.0.0)",
    "qdrant-client (>=1.13.0,<2.0.0)",
    "sentence-transformers (>=3.0.0,<4.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "langgraph-checkpoint-sqlite (>=3.1.1,<4.0.0)",
    "gitpython (>=3.1.0,<4.0.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "boto3 (>=1.43.108,<2.0.0)",
    "fastapi (>=0.115.0,<1.0.0)",
    "uvicorn (>=0.30.0,<2.0.0)",
    "langchain-openai (>=1.0.0,<2.0.0)",
    "langchain-anthropic (>=1.0.0,<2.0.0)",
]


[project.scripts]
ai-architect = "ai_architect.cli.main:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
