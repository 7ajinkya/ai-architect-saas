[project]
name = "ai-architect"
version = "0.1.0"
description = "Agentic AI Architect SaaS"
authors = [
    {name = "Ajinkya",email = "ajinkyanitin00@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
